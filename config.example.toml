# Общие параметры развёртывания. Персональные данные и трудозатраты пользователей
# хранятся в SQLite, а не в этом файле.

url = "ВАША_ССЫЛКА_НА_ФОРМУ"

# Эти поля используются только для безопасной миграции первого администратора
# со старой однопользовательской версии. Для новых пользователей профиль
# заполняется отдельно и подтверждается администратором.
department = "ВАШ_ОТДЕЛ"
employee_name = "ВАШЕ_ИМЯ"

# true — проверочный прогон: форма не отправляется и недельный лимит не тратится.
debug = true

# local — браузер на сервере; remote — Browserless. Не включайте session_replay
# для персональных данных без отдельного согласования и оценки рисков.
browser_mode = "local"
browserless_token = ""
browserless_endpoint = "wss://chrome.browserless.io"
session_replay = false

# Значения по умолчанию для одобренных пользователей. Их можно изменить каждому
# пользователю в личном чате; сумма должна быть равна 100 для отправки.
[workload]
SITES_ADMIN = 8
SITES_DEVELOPMENT = 82
REPORTING = 10
DOCUMENTATION = 0
SITES_TECH_SUPPORT = 0
BUGS_PROCESSING = 0
CLIENT_SUPPORT = 0
INTERNAL_SUPPORT = 0
WORKAROUNDS = 0
INFRASTRUCTURE = 0
BACKUPS = 0
INTERNAL_TRAINING = 0
EXTERNAL_TRAINING = 0
ANALYTICS = 0
TASK_TRACKER = 0
QUALITY_CONTROL = 0
MANAGEMENT = 0
CRM_DEVELOPMENT = 0
NAUMEN_ADMIN = 0

[telegram]
# Предпочтительно передать токен через переменную окружения TELEGRAM_BOT_TOKEN.
token = "ВАШ_ТОКЕН_БОТА"

# Обязательная безопасная инициализация: Telegram user ID администраторов
# (не chat ID). Первый написавший боту пользователем администратором не станет.
bootstrap_admin_ids = [123456789]

# Максимальное число пользователей со статусом pending, user или admin.
# Допустимо любое положительное целое число; 300 — значение по умолчанию.
max_users = 300

# Лимит задаётся в меню /admin и по умолчанию равен 1 отправке на пользователя
# в ISO-неделю. Здесь остаются только параметры развёртывания.
business_timezone = "Europe/Moscow"
report_workers = 1
